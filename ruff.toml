line-length = 88
target-version = "py312"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[lint.flake8-bugbear]
# FastAPI's Depends/Query/Header in default arguments is the intended pattern.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
]

[lint.per-file-ignores]
"tests/*" = ["E501"]
# load_dotenv() must run before the app imports, so imports come after code.
"alembic/env.py" = ["E402"]
# One long default connection string.
"app/config.py" = ["E501"]
